bio: |
  Stefan reconstructs Younger Dryas landscapes from sediments: grain size, magnetic susceptibility, loss-on-ignition, micromorphology and radiocarbon-dated plant remains. He is a geoarchaeologist specialising in micromorphology, and previously worked as a Quaternary scientist in commercial archaeology in the UK and on cultural heritage projects in Western Australia.
